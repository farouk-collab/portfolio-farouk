name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Audit hebdomadaire des dépendances, même sans nouveau commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, build & audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation (lockfile strict)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires (cohérence FR/EN, données, logos)
        run: npm test

      - name: Build + pré-rendu
        run: npm run build

      - name: Vérification du rendu statique
        run: |
          grep -q "Des données fiables" dist/index.html
          grep -q '<html lang="fr">' dist/index.html
          grep -q "Reliable data" dist/en/index.html
          grep -q '<html lang="en">' dist/en/index.html
          grep -q "ayinde-farouk-salami-cv.pdf" dist/index.html
          grep -q "ayinde-farouk-salami-cv-en.pdf" dist/en/index.html
          test -f dist/cv/ayinde-farouk-salami-cv.pdf
          test -f dist/cv/ayinde-farouk-salami-cv-en.pdf
          test -f dist/sitemap.xml && test -f dist/robots.txt

      - name: Budget de poids (dist < 25 Mo)
        run: |
          size=$(du -sm dist | cut -f1)
          echo "Taille de dist : ${size} Mo"
          test "$size" -lt 25

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high

      - name: Installation de Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end (parcours, accessibilité axe, aucune requête tierce)
        run: npm run test:e2e

      - name: Lighthouse CI (performance ≥ 95, accessibilité / bonnes pratiques / SEO = 100)
        run: npx lhci autorun

      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            playwright-report
            test-results
            .lighthouseci
          retention-days: 7

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portfolio-farouk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumée (en-têtes + contenu)
        run: |
          docker run -d --name web -p 8080:8080 portfolio-farouk:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsI http://localhost:8080/ | tee headers.txt
          grep -qi "content-security-policy" headers.txt
          grep -qi "x-frame-options: DENY" headers.txt
          curl -fs http://localhost:8080/ | grep -q "Des données fiables"
          curl -fs http://localhost:8080/en/ | grep -q "Reliable data"
          curl -fsI http://localhost:8080/en/ | grep -qi "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/n-existe-pas)" = "404"
          docker rm -f web

  deploy:
    name: Déploiement Render + vérification prod
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    environment:
      name: production
      url: https://portfolio-farouk.onrender.com
    env:
      SITE: https://portfolio-farouk.onrender.com
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Déclenchement du déploiement
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK absent : déploiement et vérification de la prod ignorés."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
            echo "Déploiement demandé à Render."
          fi

      - name: Attente de la mise en ligne du commit
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fs "$SITE/?ci=$GITHUB_RUN_ID-$i" | grep -o 'name="build-commit" content="[^"]*"' | cut -d'"' -f4 || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Commit $GITHUB_SHA en ligne."; exit 0; fi
            echo "En ligne : ${live:-inconnu} — attente ($i/60)"
            sleep 10
          done
          echo "::error::Le commit n'est pas en production après 10 minutes."
          exit 1

      - name: Vérification de la production
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -fsI "$SITE/" | tee headers.txt
          for h in content-security-policy x-frame-options strict-transport-security x-content-type-options referrer-policy permissions-policy cross-origin-opener-policy; do
            grep -qi "^$h:" headers.txt || { echo "::error::En-tête manquant : $h"; exit 1; }
          done
          curl -fs "$SITE/" | grep -q "Des données fiables"
          curl -fs "$SITE/en/" | grep -q "Reliable data"
          curl -fsI "$SITE/en/" | grep -qi "^content-security-policy:"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/cv/ayinde-farouk-salami-cv.pdf")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/cv/cv-farouk.pdf")" = "301"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/n-existe-pas")" = "404"
          echo "Production conforme."
