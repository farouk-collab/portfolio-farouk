name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Audit hebdomadaire des dépendances, même sans nouveau commit.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build & audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installation (lockfile strict)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build + pré-rendu
        run: npm run build

      - name: Vérification du rendu statique
        run: |
          grep -q "Des données fiables" dist/index.html
          grep -q "ayinde-farouk-salami-cv.pdf" dist/index.html
          test -f dist/cv/ayinde-farouk-salami-cv.pdf

      - name: Budget de poids (dist < 25 Mo)
        run: |
          size=$(du -sm dist | cut -f1)
          echo "Taille de dist : ${size} Mo"
          test "$size" -lt 25

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portfolio-farouk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de fumée (en-têtes + contenu)
        run: |
          docker run -d --name web -p 8080:8080 portfolio-farouk:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsI http://localhost:8080/ | tee headers.txt
          grep -qi "content-security-policy" headers.txt
          grep -qi "x-frame-options: DENY" headers.txt
          curl -fs http://localhost:8080/ | grep -q "Des données fiables"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/n-existe-pas)" = "404"
          docker rm -f web
